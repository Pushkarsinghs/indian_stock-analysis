name: Daily NIFTY 50 Data Update

on:
  schedule:
    - cron: '0 11 * * 1-5'  # 4:30 PM IST = 11:00 UTC, Mon-Fri only
  workflow_dispatch:          # Also allows manual trigger

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repo
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        pip install yfinance pandas numpy ta pyarrow feedparser textblob
        
    - name: Run quick data refresh
      run: |
        python scripts/quick_refresh.py
        
    - name: Commit and push updated data
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add streamlit_app/data/*.csv
        git diff --staged --quiet || git commit -m "Auto-update data $(date +'%Y-%m-%d')"
        git push
