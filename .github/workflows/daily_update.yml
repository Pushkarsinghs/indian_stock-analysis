name: Daily NIFTY 50 Data Refresh

on:
  schedule:
    - cron: '0 11 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            "yfinance>=0.2.50" \
            pandas \
            numpy \
            ta \
            feedparser \
            textblob \
            pyarrow \
            requests \
            "curl_cffi>=0.6.0"

      - name: Verify dependencies
        run: |
          python -c "
          import yfinance, pandas, numpy, ta, feedparser, textblob, curl_cffi
          print('All dependencies installed successfully')
          print('yfinance version:', yfinance.__version__)
          print('pandas version:', pandas.__version__)
          "

      - name: Run data refresh
        run: python scripts/quick_refresh.py

      - name: Verify output files exist
        run: |
          python -c "
          import os, pandas as pd
          required = [
              'streamlit_app/data/nifty50_technical_powerbi.csv',
              'streamlit_app/data/latest_signals.csv',
              'streamlit_app/data/nifty50_for_powerbi.csv',
              'streamlit_app/data/nifty50_sentiment_powerbi.csv',
              'streamlit_app/data/nifty50_risk_metrics_powerbi.csv',
          ]
          all_ok = True
          for f in required:
              if os.path.exists(f):
                  rows = len(pd.read_csv(f))
                  print('OK', f, rows, 'rows')
              else:
                  print('MISSING', f)
                  all_ok = False
          if not all_ok:
              raise SystemExit('Required files missing')
          print('All required files verified')
          "

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push updated CSV files
        run: |
          git add streamlit_app/data/
          if git diff --staged --quiet; then
            echo "No changes detected in data files"
          else
            CHANGED=$(git diff --staged --name-only | wc -l)
            echo "Committing $CHANGED changed files"
            git commit -m "Auto-update: NIFTY 50 data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "Successfully pushed updated data to GitHub"
          fi
