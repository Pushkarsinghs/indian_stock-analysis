name: Daily NIFTY 50 Data Refresh

on:
  schedule:
    - cron: '30 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            "yfinance>=0.2.50" \
            pandas \
            numpy \
            ta \
            feedparser \
            textblob \
            pyarrow \
            requests \
            "curl_cffi>=0.6.0" \
            lxml

      - name: Run data refresh
        run: python scripts/quick_refresh.py

      - name: Check output files
        run: |
          python -c "
          import os, pandas as pd
          from datetime import datetime
          files = [
              'streamlit_app/data/nifty50_technical_powerbi.csv',
              'streamlit_app/data/latest_signals.csv',
              'streamlit_app/data/nifty50_for_powerbi.csv',
          ]
          all_ok = True
          for f in files:
              if os.path.exists(f):
                  df   = pd.read_csv(f)
                  rows = len(df)
                  size = os.path.getsize(f)/1024
                  print(f'OK  {f}  {rows} rows  {size:.0f}KB')
                  if rows == 0:
                      all_ok = False
              else:
                  print(f'MISSING  {f}')
                  all_ok = False
          if not all_ok:
              raise SystemExit('Files missing or empty')
          print('All files verified')
          "

           - name: Push updated data to GitHub
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add streamlit_app/data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update: NIFTY 50 data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin main
            echo "Data pushed successfully"
          fi
