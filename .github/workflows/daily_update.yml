name: Daily NIFTY 50 Data Refresh

on:
  schedule:
    - cron: '0 11 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            yfinance==0.2.38 \
            pandas==2.1.4 \
            numpy==1.26.4 \
            ta==0.11.0 \
            feedparser==6.0.11 \
            textblob==0.17.1 \
            pyarrow==14.0.2 \
            requests==2.31.0

      - name: Verify dependencies installed
        run: |
          python -c "
          import yfinance, pandas, numpy, ta, feedparser, textblob
          print('yfinance:', yfinance.__version__)
          print('pandas:', pandas.__version__)
          print('numpy:', numpy.__version__)
          print('All dependencies verified')
          "

      - name: Run data refresh script
        run: |
          python scripts/quick_refresh.py
        env:
          PYTHONUNBUFFERED: '1'

      - name: Check files were generated
        run: |
          python -c "
          import os, pandas as pd
          files = [
              'streamlit_app/data/nifty50_technical_powerbi.csv',
              'streamlit_app/data/latest_signals.csv',
              'streamlit_app/data/nifty50_for_powerbi.csv',
              'streamlit_app/data/nifty50_sentiment_powerbi.csv',
              'streamlit_app/data/nifty50_risk_metrics_powerbi.csv',
          ]
          all_ok = True
          for f in files:
              if os.path.exists(f):
                  rows = len(pd.read_csv(f))
                  size = os.path.getsize(f) / 1024
                  print(f'OK  {f}  {rows} rows  {size:.0f}KB')
              else:
                  print(f'MISSING  {f}')
                  all_ok = False
          if not all_ok:
              exit(1)
          print('All files generated successfully')
          "

      - name: Commit and push updated data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add streamlit_app/data/
          if git diff --staged --quiet; then
            echo "No changes to commit - data is already up to date"
          else
            git commit -m "Auto-update: NIFTY 50 data $(date +'%Y-%m-%d %H:%M') IST"
            git push
            echo "Data files pushed to GitHub successfully"
          fi
